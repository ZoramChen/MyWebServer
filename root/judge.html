<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebServer</title>
    <style>
        /* 全局样式重置与基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f5f5f5;
            padding-top: 60px;
        }
        /* 标题样式 */
        .title-wrap {
            text-align: center;
            margin-bottom: 40px;
        }
        .title-text {
            font-size: 20px; /* 对应font size="5"的近似大小 */
            font-weight: bold;
            color: #333;
        }
        /* 表单容器样式 */
        .form-container {
            text-align: center;
            margin: 20px 0;
        }
        /* 按钮样式优化 */
        .btn {
            padding: 10px 30px;
            font-size: 16px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #3367d6;
        }
    </style>
</head>
<body>
    <div class="title-wrap">
        <span class="title-text">欢迎访问</span>
    </div>
    <div class="form-container">
        <form action="0" method="post">
            <button type="submit" class="btn">新用户</button>
        </form>
    </div>
    <div class="form-container">
        <form action="1" method="post">
            <button type="submit" class="btn">已有账号</button>
        </form>
    </div>
</body>
</html>
