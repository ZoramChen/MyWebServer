<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebServer</title>
    <style>
        /* 统一样式体系 - 参考百度网盘风格 */
        :root {
            --primary-color: #2d7ff9;
            --secondary-color: #4096ff;
            --light-color: #f5f8ff;
            --dark-color: #333;
            --gray-color: #8c8c8c;
            --border-color: #e5e6eb;
            --hover-color: #e8f0fe;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            max-width: 800px;
            margin: 0 auto 40px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            font-size: 22px;
            font-weight: 600;
        }

        .logo i {
            font-size: 24px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            text-align: center;
        }

        .title {
            font-size: 24px;
            color: var(--dark-color);
            margin-bottom: 40px;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .action-btn {
            padding: 14px 20px;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--dark-color);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .action-btn:hover {
            background-color: var(--hover-color);
            border-color: var(--secondary-color);
            color: var(--primary-color);
        }

        .footer {
            max-width: 800px;
            margin: 40px auto 0;
            text-align: center;
            color: var(--gray-color);
            font-size: 14px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .action-btn {
                max-width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <i class="fas fa-cloud"></i>
            <span>WebServer 网盘</span>
        </div>
    </div>

    <div class="container">
        <div class="title"><strong>是时候做出选择了</strong></div>
        
        <div class="btn-group">
            <form action="5" method="post">
                <button type="submit" class="action-btn">xxx.jpg</button>
            </form>

            <form action="6" method="post">
                <button type="submit" class="action-btn">xxx.avi</button>
            </form>

            <form action="8" method="post">
                <button type="submit" class="action-btn"><i class="fas fa-upload"></i> 上传文件</button>
            </form>

            <form action="a" method="post">
                <button type="submit" class="action-btn"><i class="fas fa-download"></i> 下载文件</button>
            </form>

            <form action="7" method="post">
                <button type="submit" class="action-btn">关注我</button>
            </form>
        </div>
    </div>

    <div class="footer">
        © 2023 WebServer 文件服务 | 版本 2.0
    </div>
</body>
</html>
